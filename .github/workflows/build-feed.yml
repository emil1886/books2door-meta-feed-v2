name: Build Books2Door Meta feed v2

on:
  schedule:
    - cron: '0 * * * *'      # hourly; DataFeedWatch refreshes several times a day
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build feed from DataFeedWatch source
        run: python build_feed.py --out-dir docs --min-products 3500

      # Pages serves the artifact built above, so the commit is only a history
      # snapshot. At ~1.3 MB compressed per commit, doing it hourly would add
      # ~11 GB a year, so keep it to once a day.
      - name: Commit refreshed feed (daily history snapshot)
        run: |
          hour=$(date -u +%H)
          if [ "$hour" != "06" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "hourly run at ${hour}:00 UTC - rebuilding and deploying only, no commit"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --staged --quiet && { echo "no change to commit"; exit 0; }
          git commit -m "Refresh Books2Door Meta feed v2 ($(date -u +%Y-%m-%d))"
          git pull --rebase --strategy-option=ours origin main
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
