name: Build Books2Door Meta feed v2

on:
  schedule:
    # Twice daily. GitHub defers scheduled runs under load - these were firing
    # 5-8 hours late and 06 Oct missed entirely - so two attempts mean a deferred
    # run is not a lost day. The evening slot also catches DataFeedWatch's late
    # refreshes, which have landed as late as 18:23 UTC.
    - cron: '0 6 * * *'
    - cron: '0 20 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Four attempts half an hour apart is 90 minutes of waiting at worst. The
    # job holds the 'pages' concurrency group while it waits, so a manual
    # dispatch during a retry queues behind it rather than running alongside.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # DataFeedWatch sometimes serves a truncated feed mid-refresh - 25 Nov it
      # was down to 2,921 items - and build_feed.py refuses to publish below
      # --min-products rather than mass-disabling products in Meta. That is the
      # guard working, and it clears itself once the source finishes refreshing,
      # so wait and try again rather than failing the day.
      - name: Build feed from DataFeedWatch source
        env:
          ATTEMPTS: '4'
          RETRY_WAIT_SECONDS: '1800'
        run: |
          wait_min=$(( RETRY_WAIT_SECONDS / 60 ))
          total_min=$(( (ATTEMPTS - 1) * RETRY_WAIT_SECONDS / 60 ))
          attempt=1
          while true; do
            if python build_feed.py --out-dir docs --basename b2d-claude-feed --min-products 2500; then
              echo "Built on attempt $attempt of $ATTEMPTS."
              break
            fi
            if [ "$attempt" -ge "$ATTEMPTS" ]; then
              echo "::error::Build failed on all $ATTEMPTS attempts over $total_min minutes. The DataFeedWatch source is most likely still short. The previously published feed is untouched and stays live."
              exit 1
            fi
            echo "::warning::Attempt $attempt failed. Retrying in $wait_min minutes, $(( ATTEMPTS - attempt )) attempt(s) left."
            sleep "$RETRY_WAIT_SECONDS"
            attempt=$(( attempt + 1 ))
          done

      # Older filenames stay published as copies so URLs already handed out keep
      # working. Drop the ones nothing points at.
      - name: Keep the legacy filenames working
        run: |
          for ext in xml csv; do
            cp "docs/b2d-claude-feed.$ext" "docs/feed.$ext"
            cp "docs/b2d-claude-feed.$ext" "docs/books2door_meta_feed_v2.$ext"
          done

      # Pages serves the artifact built above; this commit is only a history
      # snapshot, so one a day is plenty. At ~1.3 MB compressed per commit,
      # committing on both runs would add ~0.9 GB a year, so the evening run
      # rebuilds and republishes without committing.
      - name: Commit refreshed feed (morning run only)
        run: |
          if [ "$(date -u +%H)" -ge 12 ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "evening run - rebuilding and publishing only, no commit"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --staged --quiet && { echo "no change to commit"; exit 0; }
          git commit -m "Refresh Books2Door Meta feed v2 ($(date -u +%Y-%m-%d))"
          git pull --rebase --strategy-option=ours origin main
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
