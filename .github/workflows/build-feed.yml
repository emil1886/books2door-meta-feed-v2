name: Build Books2Door Meta feed v2

on:
  schedule:
    # Twice daily. GitHub defers scheduled runs under load - these were firing
    # 5-8 hours late and 06 Oct missed entirely - so two attempts mean a deferred
    # run is not a lost day. The evening slot also catches DataFeedWatch's late
    # refreshes, which have landed as late as 18:23 UTC.
    - cron: '0 6 * * *'
    - cron: '0 20 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build feed from DataFeedWatch source
        run: python build_feed.py --out-dir docs --basename b2d-claude-feed --min-products 3500

      # Older filenames stay published as copies so URLs already handed out keep
      # working. Drop the ones nothing points at.
      - name: Keep the legacy filenames working
        run: |
          for ext in xml csv; do
            cp "docs/b2d-claude-feed.$ext" "docs/feed.$ext"
            cp "docs/b2d-claude-feed.$ext" "docs/books2door_meta_feed_v2.$ext"
          done

      # Pages serves the artifact built above; this commit is only a history
      # snapshot, so one a day is plenty. At ~1.3 MB compressed per commit,
      # committing on both runs would add ~0.9 GB a year, so the evening run
      # rebuilds and republishes without committing.
      - name: Commit refreshed feed (morning run only)
        run: |
          if [ "$(date -u +%H)" -ge 12 ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "evening run - rebuilding and publishing only, no commit"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --staged --quiet && { echo "no change to commit"; exit 0; }
          git commit -m "Refresh Books2Door Meta feed v2 ($(date -u +%Y-%m-%d))"
          git pull --rebase --strategy-option=ours origin main
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
